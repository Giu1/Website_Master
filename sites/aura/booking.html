<!DOCTYPE html>
<html lang="en" data-i18n-page="booking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book — Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <p class="announce" data-announce></p>
  <header class="site-header">
    <a class="logo" href="index.html">Aura</a>
    <div class="header-tools">
      <div class="lang" role="group" data-i18n-aria="lang">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" data-i18n="menu">Menu</button>
    </div>
    <nav id="nav" class="nav">
      <a href="index.html" data-i18n="navHome">Home</a>
      <a href="services.html" data-i18n="navServices">Services</a>
      <a href="team.html" data-i18n="navTeam">Team</a>
      <a href="gallery.html" data-i18n="navGallery">Gallery</a>
      <a href="booking.html" aria-current="page" data-i18n="navBook">Book</a>
      <a href="contact.html" data-i18n="navContact">Contact</a>
    </nav>
  </header>
  <main id="main" class="page">
    <h1 data-i18n="take">Take a chair.</h1>
    <form class="glass" id="booking-form" style="max-width:32rem">
      <label><span data-i18n="name">Name</span> <input name="name" required autocomplete="name"></label>
      <label><span data-i18n="service">Service</span> <select name="service" data-service-select></select></label>
      <label><span data-i18n="date">Date</span> <input type="date" name="date" required></label>
      <label><span data-i18n="time">Time</span>
        <select name="time">
          <option>10:00</option>
          <option>11:30</option>
          <option>14:00</option>
          <option>16:00</option>
          <option>18:00</option>
        </select>
      </label>
      <button class="btn" type="submit" data-i18n="hold">Hold it</button>
      <p class="form-status" role="status"></p>
    </form>
  </main>
  <div class="call-bar">
    <a href="tel:+351210000000">+351 21 000 000</a>
    <a href="https://wa.me/351210000000">WhatsApp</a>
  </div>
  <footer class="site-footer"><p data-i18n="footer">Aura · fictional salon</p><p><a href="../aura-desk/" data-i18n="openDesk">Open the desk</a></p></footer>
  <aside class="demo-badge" data-i18n-aria="demo"><span>Demo</span><a href="../atelier/" data-i18n="demoLink">I build sites like this</a></aside>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
