<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura Desk — backoffice</title>
  <meta name="description" content="Demo admin for the Aura salon. Login demo / demo. Edits write to the same store the public site reads.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app" data-i18n="skip">Skip to desk</a>
  <div class="lang-bar">
    <div class="lang" role="group" data-i18n-aria="lang">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
  </div>

  <section id="login" class="login">
    <div class="login-card">
      <p class="eyebrow" data-i18n="eyebrow">Aura Desk</p>
      <h1 data-i18n="sign">Sign in to the floor.</h1>
      <p data-i18n="creds">Demo credentials: <code>demo</code> / <code>demo</code></p>
      <form id="login-form">
        <label><span data-i18n="user">User</span> <input name="user" autocomplete="username" required></label>
        <label><span data-i18n="pass">Password</span> <input name="pass" type="password" autocomplete="current-password" required></label>
        <button type="submit" data-i18n="enter">Enter</button>
        <p class="form-status" role="status"></p>
      </form>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <aside class="side">
      <p class="brand">Aura Desk</p>
      <nav>
        <button type="button" data-view="dash" aria-current="page" data-i18n="dash">Dashboard</button>
        <button type="button" data-view="bookings" data-i18n="bookings">Bookings</button>
        <button type="button" data-view="services" data-i18n="services">Services</button>
        <button type="button" data-view="staff" data-i18n="staff">Staff</button>
        <button type="button" data-view="hours" data-i18n="hours">Hours</button>
        <button type="button" data-view="content" data-i18n="copy">Site copy</button>
      </nav>
      <a class="side-link" href="../aura/" data-i18n="public">View public site</a>
      <button type="button" id="logout" data-i18n="logout">Log out</button>
    </aside>

    <main class="main">
      <section data-panel="dash">
        <h1 data-i18n="today">Today</h1>
        <div class="stats" id="stats"></div>
        <h2 data-i18n="next">Next bookings</h2>
        <div class="table-wrap" id="dash-bookings"></div>
      </section>

      <section data-panel="bookings" hidden>
        <h1 data-i18n="bookings">Bookings</h1>
        <div class="table-wrap" id="bookings-table"></div>
      </section>

      <section data-panel="services" hidden>
        <h1 data-i18n="services">Services</h1>
        <form id="service-form" class="inline-form">
          <input name="name" data-i18n-placeholder="name" placeholder="Name" required>
          <input name="price" type="number" min="1" placeholder="€" required>
          <input name="duration" type="number" min="10" data-i18n-placeholder="min" placeholder="min" required>
          <button type="submit" data-i18n="add">Add</button>
        </form>
        <div class="table-wrap" id="services-table"></div>
      </section>

      <section data-panel="staff" hidden>
        <h1 data-i18n="staff">Staff</h1>
        <form id="staff-form" class="inline-form">
          <input name="name" data-i18n-placeholder="name" placeholder="Name" required>
          <input name="role" data-i18n-placeholder="role" placeholder="Role" required>
          <input name="days" data-i18n-placeholder="days" placeholder="Days" required>
          <button type="submit" data-i18n="add">Add</button>
        </form>
        <div class="table-wrap" id="staff-table"></div>
      </section>

      <section data-panel="hours" hidden>
        <h1 data-i18n="hours">Hours</h1>
        <form id="hours-form" class="stack-form"></form>
      </section>

      <section data-panel="content" hidden>
        <h1 data-i18n="copy">Site copy</h1>
        <form id="content-form" class="stack-form">
          <label><span data-i18n="announce">Announcement</span> <input name="announcement"></label>
          <label><span data-i18n="hero">Hero line</span> <input name="hero"></label>
          <button type="submit" data-i18n="saveCopy">Save copy</button>
          <p class="form-status" role="status"></p>
        </form>
      </section>
    </main>
  </div>

  <aside class="demo-badge" data-i18n-aria="demo">
    <span>Demo</span>
    <a href="../atelier/" data-i18n="demoLink">I build sites like this</a>
  </aside>

  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
