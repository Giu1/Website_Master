<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucas Bastos • Work</title>
  <meta name="description" content="Lucas Bastos, designer and developer in Lisbon, and every site he has built." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=Silkscreen&family=Newsreader:opsz,wght@6..72,460;6..72,520&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="v-featured hero-mode">
  <!-- ───── Lucas header: shown first; scrolling down plays the panel by hand and reveals the work stage ───── -->
  <div class="hl-loader" id="hl-loader" aria-hidden="true">
    <p class="hl-word"><span class="dot"></span><span id="hello">Hello</span></p>
    <div class="hl-curve"></div>
  </div>

  <header class="hero" id="hero" style="--hero:#344243">
    <div class="bar">
      <a class="credit" href="#featured" data-credit>
        <span class="copy">©</span>
        <span class="swap"><span data-i18n="credit">Code by Lucas</span><span>Lucas Bastos</span></span>
      </a>
      <div class="bar-right">
        <ul class="bar-links">
          <li><a href="#featured" data-reveal-work data-i18n="nav.work">Work</a></li>
          <li><a href="about.html" data-i18n="nav.about">About</a></li>
          <li><a href="contact.html" data-i18n="nav.contact">Contact</a></li>
        </ul>
        <div class="lang" role="group" aria-label="Language" data-i18n-aria="language.attr"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="pt" aria-pressed="false">PT</button></div>
      </div>
    </div>

    <div class="portrait wide" id="portrait">
      <img src="img/hero/lucas-wide.jpg" alt="Lucas Bastos" fetchpriority="high" />
    </div>

    <div class="photo-switch" role="group" aria-label="Choose the hero photo" data-i18n-aria="photo.group.attr">
      <span class="ps-label" data-i18n="photo">Photo</span>
        <button type="button" data-photo="img/hero/lucas-wide.jpg" data-bg="#344243" data-wide aria-label="Photo 1" data-i18n-aria="photo1.attr" aria-pressed="true"><img src="img/hero/lucas-wide-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-wide-2.jpg" data-bg="#384546" data-wide aria-label="Photo 2" data-i18n-aria="photo2.attr" aria-pressed="false"><img src="img/hero/lucas-wide-2-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-1-w.jpg" data-bg="#3b4b49" aria-label="Photo 3" data-i18n-aria="photo3.attr" aria-pressed="false"><img src="img/hero/lucas-1-w-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-2.jpg" data-bg="#364747" aria-label="Photo 4" data-i18n-aria="photo4.attr" aria-pressed="false"><img src="img/hero/lucas-2-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-3.jpg" data-bg="#41514f" aria-label="Photo 5" data-i18n-aria="photo5.attr" aria-pressed="false"><img src="img/hero/lucas-3-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-4-w.jpg" data-bg="#3c4d4d" aria-label="Photo 6" data-i18n-aria="photo6.attr" aria-pressed="false"><img src="img/hero/lucas-4-w-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-5.jpg" data-bg="#334343" aria-label="Photo 7" data-i18n-aria="photo7.attr" aria-pressed="false"><img src="img/hero/lucas-5-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-6.jpg" data-bg="#374847" aria-label="Photo 8" data-i18n-aria="photo8.attr" aria-pressed="false"><img src="img/hero/lucas-6-thumb.jpg" alt="" /></button>
        <button type="button" data-photo="img/hero/lucas-7-w.jpg" data-bg="#324041" aria-label="Photo 9" data-i18n-aria="photo9.attr" aria-pressed="false"><img src="img/hero/lucas-7-w-thumb.jpg" alt="" /></button>
    </div>

    <div class="hanger">
      <p data-i18n="hanger">Located<br />in<br />Portugal</p>
      <span class="globe" aria-hidden="true">
        <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="9" /><ellipse class="spin" cx="12" cy="12" rx="4.2" ry="9" /><path d="M3 12 H21 M4.6 7.5 H19.4 M4.6 16.5 H19.4" /></g></svg>
      </span>
    </div>

    <div class="caption">
      <svg class="arrow" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 L12 12 M12 4.5 V12 H4.5" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
      <p data-i18n="caption">Freelance<br />Designer &amp; Developer</p>
    </div>

    <h1 class="sr-only" data-i18n="h1">Lucas Bastos — freelance designer &amp; developer in Lisbon</h1>
    <div class="big-name" aria-hidden="true">
      <div class="track" id="name-track"><span>Lucas Bastos <em>—</em></span><span>Lucas Bastos <em>—</em></span></div>
    </div>

    <p class="scroll-cue" aria-hidden="true"><span data-i18n="scroll">Scroll</span><i></i></p>
  </header>

  <!-- the page-change panel, driven by the scroll position instead of a timer -->
  <div class="veil" id="veil" aria-hidden="true">
    <div class="v-curve v-top"></div>
    <p class="v-label"><span class="dot"></span><span class="v-text">Work</span></p>
    <div class="v-curve v-bottom"></div>
  </div>
  <canvas id="lens" aria-hidden="true"></canvas>

  <section id="index" aria-labelledby="index-title">
    <h1 class="sr-only" id="index-title">Index</h1>
    <p id="index-list"></p>
  </section>

  <section id="grid" aria-labelledby="grid-title">
    <div class="grid-inner">
      <header class="grid-head">
        <h1 id="grid-title">Selected work</h1>
        <p id="grid-count" class="label"></p>
      </header>
      <ul class="grid-list" id="grid-list"></ul>
    </div>
  </section>

  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="flat" hidden></div>
  <div id="intro" aria-hidden="true"></div>

  <section id="profile" class="panel" aria-label="Profile" hidden>
    <div class="ring-css" aria-hidden="true"></div>
    <div class="panel-inner">
      <div id="profile-copy"></div>
      <p class="awards label" id="awards"></p>
      <ul class="socials" id="socials"></ul>
    </div>
  </section>


  <header class="chrome">
    <a class="label" id="brand" href="#featured">Elena Voss</a>
    <button class="label to-top" id="to-top" type="button" aria-label="Back to the top">↑ Top</button>
    <button class="label" id="profile-btn" type="button" aria-expanded="false" aria-controls="profile">Profile</button>
  </header>

  <div class="dock">
    <div class="dock-left">
    <nav class="views label" aria-label="Project views">
      <span class="pill" aria-hidden="true"></span>
      <a id="nav-featured" href="#featured" aria-current="true">Featured</a>
      <a id="nav-full" href="#full">Full</a>
      <a id="nav-traditional" href="#traditional">Traditional</a>
    </nav>
    </div>
    <a class="contact-px" id="contact-btn" href="contact.html" aria-label="Contact me">
      <canvas aria-hidden="true"></canvas>
    </a>
  </div>

  <section id="case" hidden role="dialog" aria-modal="true" aria-labelledby="case-title">
    <div class="case-backdrop"></div>
    <div class="sheets" id="sheets"></div>
    <button id="case-x" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5 L11.5 11.5 M11.5 4.5 L4.5 11.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </section>

  <div id="loader" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="sr-only" id="a11y"></div>

  <script src="js/i18n.js"></script>
  <script src="js/hero-lang.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/data.js"></script>
  <script src="js/contact-px.js"></script>
  <script type="module" src="js/site.js"></script>
</body>
</html>
