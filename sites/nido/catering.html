<!DOCTYPE html>
<html lang="en" data-i18n-page="catering">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catering — Nido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <header class="site-header">
    <a class="logo" href="index.html">Nido</a>
    <div class="header-tools">
      <div class="lang" role="group" data-i18n-aria="lang">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" data-i18n="menu">Menu</button>
    </div>
    <nav id="nav" class="nav">
      <a href="index.html" data-i18n="navHome">Home</a>
      <a href="menu.html" data-i18n="navMenu">Menu</a>
      <a href="events.html" data-i18n="navWeek">Weekends</a>
      <a href="catering.html" aria-current="page" data-i18n="navCater">Catering</a>
      <a href="contact.html" data-i18n="navVisit">Visit</a>
    </nav>
  </header>
  <main id="main" class="page">
    <h1 data-i18n="room">Breakfast for a room.</h1>
    <p class="lede" data-i18n="roomLede">Boxes of pastry, a urn of coffee, bread that still argues. Forty-eight hours if you can.</p>
    <form id="cater-form" class="card">
      <label><span data-i18n="name">Name</span> <input name="name" required></label>
      <label><span data-i18n="head">Headcount</span> <input name="count" type="number" min="6" value="12"></label>
      <label><span data-i18n="date">Date</span> <input name="date" type="date" required></label>
      <label><span data-i18n="noteL">Note</span> <textarea name="note" rows="3" data-i18n-placeholder="notePh" placeholder="Office, wedding morning, no nuts."></textarea></label>
      <button class="btn" type="submit" data-i18n="askBox">Ask for a box</button>
      <p class="form-status" role="status"></p>
    </form>
  </main>
  <footer class="site-footer">
    <p data-i18n="footer">Nido · fictional bakery</p>
    <p><a href="contact.html" data-i18n="visit">Visit</a></p>
  </footer>
  <aside class="demo-badge" data-i18n-aria="demo"><span>Demo</span><a href="../atelier/" data-i18n="demoLink">I build sites like this</a></aside>
  <script src="js/i18n.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
